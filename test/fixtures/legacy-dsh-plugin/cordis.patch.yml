# dsh-review-analysis bundle patch：向 profile 插入插件配置项。
# 本地安装方式：把本目录放入 ~/.dsh/local-plugins/dsh-review-analysis/
# （DeepSeek Harness 桌面应用会自动扫描 local-plugins 并合并本 patch）。
# inject 声明 tools 服务依赖：cordis 会等待服务就绪后再 apply 插件。
- insert:
    - id: review-analysis
      name: 'dsh-review-analysis'
      inject: ['tools']
      config: {}
