name: Build and Release

# 触发器：推送 v* 标签时自动构建并发布到 GitHub Release。
# 也支持在 Actions 页面手动 Run（workflow_dispatch）。
on:
  push:
    tags:
      - 'v*'
      - 'review-analysis-v*'
  workflow_dispatch:

# 云端内置令牌需要写权限才能创建 Release 并上传资产。
permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # 复用 Electron 二进制与 NSIS 工具链缓存，避免每次重新下载
      - name: Cache Electron
        if: ${{ !startsWith(github.ref_name, 'review-analysis-v') }}
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/electron
            ~/.cache/electron-builder
          key: ${{ runner.os }}-electron-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-electron-

      - name: Install dependencies
        if: ${{ !startsWith(github.ref_name, 'review-analysis-v') }}
        run: npm ci
        # 宿主若带 ELECTRON_RUN_AS_NODE 会让 Electron 退化成纯 Node，必须清掉
        env:
          ELECTRON_RUN_AS_NODE: ''

      # 发版门禁（2026-11-11）：以前推 tag 就打包，CI 不复核任何本地结论，
      # tag 落在版本漂移或测试失败的 commit 上也照发。这里补不依赖浏览器二进制的检查。
      # 三套真浏览器 e2e（_e2e/e2e.js / core-ui-verify.js / practice-e2e.js）需要
      # playwright-core 的 chromium 二进制，全新 CI 机器没有，故仍由本机 Oracle Gate 手动跑，
      # 不写进 CI 冒充门禁。见 PROCESS/research-core-practice-loop/iteration-log.md。
      - name: Test gate
        if: ${{ !startsWith(github.ref_name, 'review-analysis-v') }}
        run: |
          npm test
          node scripts/check-versions.mjs
        env:
          ELECTRON_RUN_AS_NODE: ''

      - name: Credential scan
        if: ${{ !startsWith(github.ref_name, 'review-analysis-v') }}
        shell: bash
        run: |
          if grep -rnE "sk-[A-Za-z0-9]{20,}|ghp_[A-Za-z0-9]{20,}|github_pat_|AKIA[0-9A-Z]{16}" core renderer test _e2e 2>/dev/null | grep -vE "SUPERSECRET|SECRETKEY|abcdefghijklmnopqrstuvwxyz"; then
            echo "::error::疑似真凭据入库，禁止发版"
            exit 1
          fi
          echo "credential scan clean"

      # 只构建不发布：产出 NSIS 安装器 + 免安装版 + latest.yml + .blockmap
      - name: Build (publish never)
        if: ${{ !startsWith(github.ref_name, 'review-analysis-v') }}
        run: npx electron-builder --win nsis portable --publish never
        env:
          ELECTRON_RUN_AS_NODE: ''

      # 打包 DSH 插件为独立 zip（每个 tag 都产出，文件名带版本，对应可安装版本）。
      # 源目录必须是 plugins/dsh-review-analysis/（真 DeepSeek Harness，读 ~/.dsh）；
      # plugins/review-analysis/ 是 WorkBuddy 专家形态，两者宿主不同，见 plugins/README.md 形态地图。
      - name: Package DSH plugin zip
        run: |
          Compress-Archive -Path plugins/dsh-review-analysis -DestinationPath review-analysis-dsh-plugin-${{ github.ref_name }}.zip -Force
          ls review-analysis-dsh-plugin-${{ github.ref_name }}.zip

      # 插件 zip：每个 tag 都上传；notes 仅在插件 tag 时生成（避免与桌面步骤冲突）
      - name: Publish plugin to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: review-analysis-dsh-plugin-${{ github.ref_name }}.zip
          draft: false
          prerelease: false
          generate_release_notes: ${{ startsWith(github.ref_name, 'review-analysis-v') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 桌面安装器：仅主版本 v* tag 上传（插件 tag 跳过 Electron 构建，省 CI 时间）
      - name: Publish desktop to GitHub Release
        if: ${{ !startsWith(github.ref_name, 'review-analysis-v') }}
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/ReviewLibrary-Setup-*.exe
            dist/ReviewLibrary-Setup-*.exe.blockmap
            dist/ReviewLibrary-*-portable.exe
            dist/latest.yml
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
