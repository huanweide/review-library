# dsh-review-analysis bundle patch —— 统一复习项目的 DSH 入口。
#
# 本插件不是独立引擎：它 require 主项目的 core/（唯一核心），与桌面端 / HTTP / 专家形态共用同一份书与分析产物。
# config.projectRoot 指向主项目根目录（必须含 core/index.js）。
# config.library 可选；缺省 <projectRoot>/library（与主程序默认数据目录一致）。
#
# 安全：这里只放路径，**绝不放 apiKey / token**。模型配置走工具参数 cfg 或环境变量
#   DSH_LLM_BASE_URL / DSH_LLM_MODEL / DSH_LLM_API_KEY。
# inject 与 index.js 的 export const inject 保持一致：等 tools / webServer 就绪再 apply。
- insert:
    - id: review-analysis
      name: 'dsh-review-analysis'
      inject: ['tools', 'webServer']
      config:
        projectRoot: 'C:/Users/Administrator/Desktop/agent program/复习资料图书馆'
